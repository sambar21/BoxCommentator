apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-gateway
  labels: {app: go-gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app: go-gateway}
  template:
    metadata:
      labels: {app: go-gateway}
    spec:
      containers:
        - name: go-gateway
          image: boxio-gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PYTHON_SERVICE_URL
              value: http://python-service:8000
            - name: PORT
              value: "8080"
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: go-gateway
spec:
  type: NodePort
  selector: {app: go-gateway}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
